# Deploy mdBook documentation to GitHub Pages (kendricklawton.github.io/tormoni).
name: Docs

# The paths are every input this workflow reads, not just the book source. `mdbook test` compiles
# the book's Rust blocks under the pinned toolchain, so an untagged fence (which rustdoc compiles as
# Rust) fails here rather than shipping broken. A redeploy of byte-identical output is cheaper than a
# book whose examples stopped compiling.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:


# Read-only at the top, so a job added here starts with no write it did not ask for; the deploy
# job below raises exactly the two Pages needs. OpenSSF's least-privilege guidance: a write granted
# workflow-wide is granted to every job, including ones written later.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mdBook
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: mdbook

      # `mdbook build` renders; it never compiles a single Rust block, so every one of them would
      # ship as unchecked prose. `mdbook test` compiles them. Its rustdoc must be the *pinned* rustc,
      # because mdbook runs doctests from a temp dir where rustup can no longer see
      # `rust-toolchain.toml` and silently falls back to the default toolchain. The toolchain is read
      # back from rustup rather than restated here, so this cannot drift from `rust-toolchain.toml`.
      #
      # The book has no Rust blocks today; what this catches is an untagged fence, which rustdoc
      # compiles as Rust.
      - name: Test the book's Rust blocks
        run: |
          rustup run "$(rustup show active-toolchain | cut -d' ' -f1)" mdbook test docs

      - name: Build mdBook
        run: mdbook build docs

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
