# Deploy the Starlight documentation to GitHub Pages, served at the domain in `docs/public/CNAME`.
name: Docs

# Only the book's own inputs: the site build compiles no Rust, so a Rust change cannot change what
# this publishes. `every_book_fence_is_tagged` in the gate is what holds the pages' fences, and it
# runs there rather than here because the gate must need no tool this workflow installs for itself.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Read-only at the top, so a job added here starts with no write it did not ask for; the deploy
# job below raises exactly the two Pages needs. OpenSSF's least-privilege guidance: a write granted
# workflow-wide is granted to every job, including ones written later.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The version comes from `docs/.nvmrc` rather than a literal here, so this cannot drift from
      # what a contributor's `nvm use` picks.
      - uses: actions/setup-node@v7
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # `ci`, never `install`: the lockfile is the input, and a resolution that differs from a
      # contributor's is a different site than the one they reviewed.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
