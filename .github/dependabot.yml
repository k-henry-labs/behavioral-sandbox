# Dependabot keeps the GitHub Actions current. Each `uses:` names a full commit SHA with its
# version in a trailing comment, which is OpenSSF's hardening guidance: a tag is mutable, so
# whoever controls an action's repo can repoint `v2` at other code, and a SHA cannot be moved.
# Dependabot reads the comment, so it still proposes a bump and rewrites both. The cost is that
# every patch now needs a commit here; the grouping keeps that to one review a week.
#
# Not covered: actionlint, fetched by sha256 in `ci.yml` rather than as an action. Bump it by hand
# from upstream's `checksums.txt`.
#
# Actions only, on purpose: the Rust dependency lock is hand-pinned and mirrored offline (the
# vendored mirror plus audit.yml's daily RustSec check), so Cargo bumps stay a manual, reviewed
# step, never an automated PR. Nothing here lands without a human merge either; Dependabot only
# proposes.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
