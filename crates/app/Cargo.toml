[package]
name = "tormoni-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "The tormoni GUI application (`tormoni-app`): the iced spike."

[[bin]]
name = "tormoni-app"
path = "src/main.rs"

[dependencies]
# The mapping of a leased display's memfd (`SharedFrames`) and the pixel formats it names.
tormoni-krun = { path = "../krun" }
# The reports the window's keyboard and pointer become, and the lines they travel as.
tormoni-input = { path = "../input" }
# The notebook's records, read straight from the runs directory.
tormoni-record = { path = "../record" }
# The control socket a display is leased over.
tormoni-supervisor = { path = "../supervisor" }
clap = { workspace = true }
iced = { workspace = true }
# The monotonic clock the frame logs share with the helper's `--frame-log`.
rustix = { workspace = true, features = ["time"] }

# The window's own chrome is AppKit's, and the toolbar that puts its buttons on a head's line is
# one call into it. All three are already in this binary through winit, which draws the window.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSResponder", "NSToolbar", "NSView", "NSWindow"] }
objc2-foundation = "0.2"

[dev-dependencies]
tormoni-test-support = { path = "../test-support" }
ttf-parser = "0.25.1"

[lints]
workspace = true
