[package]
name = "boxdesk-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "`boxdesk serve`: one box that runs sandboxes for a caller over HTTP."

[dependencies]
# The record a served run leaves, byte for byte the one a local run leaves.
boxdesk-record = { path = "../record" }
axum = { workspace = true }
# The one trait `Body::from_stream` takes. No dependencies of its own.
futures-core = "0.3"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
boxdesk-test-support = { path = "../test-support" }
