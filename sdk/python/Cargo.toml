[package]
name = "boxdesk-py"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_boxdesk_core"
crate-type = ["cdylib"]

[dependencies]
# `abi3-py39` builds ONE wheel per platform that every CPython from 3.9 up loads, against the
# stable ABI. Without it the extension is version-specific and the matrix is a wheel per Python
# per platform, which is what `pyproject.toml`'s 3.9-3.13 classifiers would otherwise promise
# five times over.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
boxdesk-core = { package = "boxdesk", path = "../../crates/cli" }
boxdesk-record = { path = "../../crates/record" }
boxdesk-supervisor = { path = "../../crates/supervisor" }
