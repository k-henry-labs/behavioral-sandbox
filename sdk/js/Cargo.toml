[package]
name = "tormoni-js"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.14", default-features = false, features = ["napi4"] }
napi-derive = "2.14"
tormoni-core = { package = "tormoni", path = "../../crates/cli" }
tormoni-record = { path = "../../crates/record" }
tormoni-supervisor = { path = "../../crates/supervisor" }
serde_json = "1.0"
